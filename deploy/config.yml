http:
  addr: 0.0.0.0:8080

frontend:
  origin: https://nexlysocial.ru
  url: https://nexlysocial.ru

cookie:
  secure: false
  same_site: lax

media:
  dir: /data/media
  public_url: /api/media

logging:
  mode: debug

redis:
  addr: redis:6379
  db: 0
  session_ttl: 720h

auth:
  http_addr: ":8081"
  grpc_addr: ":9090"

user:
  http_addr: ":8082"
  grpc_addr: ":9091"

posts:
  http_addr: ":8083"

community:
  http_addr: ":8084"
  grpc_addr: ":9092"

smtp:
  logo_url: "https://nexlysocial.ru/public/icon.png"

local:
  is_local: false
  frontend_local:
    origin: http://localhost:8001
    url: http://localhost:8001
  smtp:
    logo_url: "http://localhost/public/icon.png"

elasticsearch:
  url: http://elasticsearch:9200
