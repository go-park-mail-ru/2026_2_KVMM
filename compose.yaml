services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kvmm-backend
    env_file:
      - ./deploy/.env
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - kvmm

  frontend:
    build:
      context: ../FRONT_2026_2_KVMM
      dockerfile: Dockerfile
    container_name: kvmm-frontend
    expose:
      - "8001"
    restart: unless-stopped
    networks:
      - kvmm

  nginx:
    image: nginx:1.27-alpine
    container_name: kvmm-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - kvmm

networks:
  kvmm:
    driver: bridge