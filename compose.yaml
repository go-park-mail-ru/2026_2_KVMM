services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: kvmm-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    expose:
      - "9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - kvmm
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: kvmm-backend
    env_file:
      - ./deploy/.env
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - kvmm
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  onlineconf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    entrypoint: ["/kvmm-onlineconf"]
    container_name: kvmm-onlineconf
    env_file:
      - ./deploy/.env
    expose:
      - "8085"
      - "9093"
    restart: unless-stopped
    networks:
      - kvmm
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      user:
        condition: service_started

  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    entrypoint: ["/kvmm-user"]
    container_name: kvmm-user
    env_file:
      - ./deploy/.env
    expose:
      - "8082"
      - "9091"
    volumes:
      - media_data:/data/media
    restart: unless-stopped
    networks:
      - kvmm
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  posts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    entrypoint: ["/kvmm-posts"]
    container_name: kvmm-posts
    env_file:
      - ./deploy/.env
    expose:
      - "8083"
    restart: unless-stopped
    networks:
      - kvmm
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      user:
        condition: service_started
      community:
        condition: service_started

  community:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    entrypoint: ["/kvmm-community"]
    container_name: kvmm-community
    env_file:
      - ./deploy/.env
    expose:
      - "8084"
      - "9092"
    volumes:
      - media_data:/data/media
    restart: unless-stopped
    networks:
      - kvmm
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      user:
        condition: service_started

  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    entrypoint: ["/kvmm-auth"]
    container_name: kvmm-auth
    env_file:
      - ./deploy/.env
    expose:
      - "8081"
      - "9090"
    restart: unless-stopped
    networks:
      - kvmm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  frontend:
    build:
      context: ../FRONT_2026_2_KVMM
      dockerfile: Dockerfile
    container_name: kvmm-frontend
    expose:
      - "8001"
    restart: unless-stopped
    networks:
      - kvmm

  nginx:
    image: nginx:1.27-alpine
    container_name: kvmm-nginx
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8002:8002"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pkg/public:/usr/share/nginx/html/public:ro
      - ./certs:/etc/nginx/certs:ro
      - ./internal/docs:/usr/share/nginx/html/docs:ro
    depends_on:
      - backend
      - auth
      - user
      - posts
      - community
      - frontend
    restart: unless-stopped
    networks:
      - kvmm

  postgres:
    image: postgres:16-alpine
    container_name: kvmm-postgres
    env_file:
      - ./deploy/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
    - "127.0.0.1:5432:5432"
    restart: unless-stopped
    networks:
      - kvmm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kvmm-redis
    env_file:
      - ./deploy/.env
    command: >
      sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - kvmm
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  elasticsearch_data:
  postgres_data:
  media_data:
  redis_data:

networks:
  kvmm:
    driver: bridge
