  #   restart: unless-stopped
  #   networks:
  #     - kvmm

  nginx:
    image: nginx:1.27-alpine
    container_name: kvmm-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      # - frontend
    restart: unless-stopped
    networks:
      - kvmm

