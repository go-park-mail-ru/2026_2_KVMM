services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kvmm-backend
    env_file:
      - ./deploy/.env
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - kvmm
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # frontend:
