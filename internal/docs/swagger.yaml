basePath: /
definitions:
  kvmm_internal_domain.AuthResponse:
    properties:
      csrf_token:
        example: a1b2c3d4e5f6
        type: string
      profile:
        $ref: '#/definitions/kvmm_internal_domain.Profile'
    type: object
  kvmm_internal_domain.ErrorResponse:
    properties:
      code:
        example: invalid_credentials
        type: string
      message:
        example: Invalid credentials
        type: string
    type: object
  kvmm_internal_domain.FeedResponse:
    properties:
      has_more:
        example: true
        type: boolean
      limit:
        example: 10
        type: integer
      next_offset:
        example: 20
        type: integer
      offset:
        example: 10
        type: integer
      posts:
        items:
          $ref: '#/definitions/kvmm_internal_domain.Post'
        type: array
    type: object
  kvmm_internal_domain.Gender:
    enum:
    - male
    - female
    - other
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
    - GenderOther
  kvmm_internal_domain.LoginRequest:
    properties:
      login:
        example: ivan_petrov
        type: string
      password:
        example: strongpassword123
        type: string
    required:
    - login
    - password
    type: object
  kvmm_internal_domain.MeResponse:
    properties:
      csrf_token:
        example: a1b2c3d4e5f6
        type: string
      profile:
        $ref: '#/definitions/kvmm_internal_domain.Profile'
    type: object
  kvmm_internal_domain.Post:
    properties:
      author:
        $ref: '#/definitions/kvmm_internal_domain.Profile'
      author_community_id:
        type: integer
      author_profile_id:
        example: 1
        type: integer
      comments_count:
        example: 0
        type: integer
      created_at:
        example: "2026-01-01T12:00:00Z"
        type: string
      deleted_at:
        type: string
      id:
        example: 1
        type: integer
      likes_count:
        example: 0
        type: integer
      media_count:
        example: 1
        type: integer
      media_urls:
        items:
          type: string
        type: array
      post_text:
        example: Привет, мир!
        type: string
      reposts_count:
        example: 0
        type: integer
      updated_at:
        type: string
    type: object
  kvmm_internal_domain.Profile:
    properties:
      avatar_urls:
        items:
          type: string
        type: array
      bio:
        example: hi!
        type: string
      birthday:
        example: "2000-05-14T00:00:00Z"
        type: string
      created_at:
        example: "2026-01-01T12:00:00Z"
        type: string
      deleted_at:
        type: string
      email:
        example: ivan@example.com
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/kvmm_internal_domain.Gender'
        enum:
        - male
        - female
        - other
        example: male
      id:
        example: 1
        type: integer
      image_url:
        example: /api/media/avatar1.png
        type: string
      nickname:
        example: ivan_petrov
        type: string
      patronymic:
        example: Иванович
        type: string
      phone_number:
        example: "+79999999999"
        type: string
      profile_name:
        example: Иван
        type: string
      surname:
        example: Иванов
        type: string
      updated_at:
        example: "2026-01-02T12:00:00Z"
        type: string
    type: object
  kvmm_internal_domain.RegisterRequest:
    properties:
      bio:
        example: hi!
        maxLength: 256
        type: string
      birthday:
        example: "2000-05-14"
        type: string
      confirm_password:
        example: sjkdfhgs4536njbjjkh
        type: string
      email:
        example: ivan@example.com
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/kvmm_internal_domain.Gender'
        enum:
        - male
        - female
        - other
        example: male
      nickname:
        example: ivan67
        maxLength: 32
        minLength: 4
        type: string
      password:
        example: sjkdfhgs4536njbjjkh
        maxLength: 72
        minLength: 8
        type: string
      patronymic:
        example: Иванович
        maxLength: 32
        minLength: 2
        type: string
      phone_number:
        example: "+79999999999"
        type: string
      profile_name:
        example: Иван
        maxLength: 32
        minLength: 2
        type: string
      surname:
        example: Иванов
        maxLength: 32
        minLength: 2
        type: string
    required:
    - confirm_password
    - gender
    - nickname
    - password
    - profile_name
    - surname
    type: object
host: localhost:8080
info:
  contact: {}
  description: MVP API для регистрации, авторизации и последовательной ленты постов.
  title: Kvmm API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Авторизует пользователя и создаёт сессию.
      parameters:
      - description: Данные авторизации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/kvmm_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kvmm_internal_domain.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kvmm_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/kvmm_internal_domain.ErrorResponse'
      summary: Авторизация пользователя
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Завершает текущую сессию пользователя.
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/kvmm_internal_domain.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/kvmm_internal_domain.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Выход из аккаунта
      tags:
      - auth
  /api/auth/me:
    get:
      description: Возвращает пользователя по авторизованной сессии.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kvmm_internal_domain.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/kvmm_internal_domain.ErrorResponse'
      security:
      - SessionCookie: []
      summary: Текущий пользователь
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Регистрирует пользователя и создаёт авторизованную сессию.
      parameters:
      - description: Данные регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/kvmm_internal_domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/kvmm_internal_domain.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/kvmm_internal_domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/kvmm_internal_domain.ErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /api/posts:
    get:
      description: Возвращает посты в обратном хронологическом порядке.
      parameters:
      - default: 0
        description: Количество пропускаемых постов
        in: query
        name: offset
        type: integer
      - default: 10
        description: Размер страницы (максимум 10)
        in: query
        maximum: 10
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/kvmm_internal_domain.FeedResponse'
      summary: Лента публикаций
      tags:
      - posts
securityDefinitions:
  SessionCookie:
    in: cookie
    name: session_id
    type: apiKey
swagger: "2.0"
