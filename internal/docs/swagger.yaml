components:
  schemas:
    domain.AcceptRelationshipRequest:
      properties:
        profile_id:
          type: integer
        relationships_type:
          example: friendship
          type: string
      required:
      - profile_id
      - relationships_type
      type: object
    domain.AuthResponse:
      properties:
        csrf_token:
          example: a1b2c3d4e5f6
          type: string
        profile:
          $ref: '#/components/schemas/domain.Profile'
      type: object
    domain.Author:
      properties:
        avatar_urls:
          example: /api/media/avatar1.png
          type: string
        name:
          description: |-
            Name - для пользователей: surname + " " + profileName, если не добавлено Name - nickname;
            Name - для сообществ: community_name
          example: Petrov Ivan
          type: string
        type:
          $ref: '#/components/schemas/domain.PostAuthorType'
          example: profile
      type: object
    domain.CancleRelationshipRequest:
      properties:
        profile_id:
          type: integer
        relationships_type:
          example: friendship
          type: string
      required:
      - profile_id
      - relationships_type
      type: object
    domain.Chat:
      properties:
        created_at:
          example: "2026-01-01T12:00:00Z"
          type: string
        id:
          example: 1
          type: integer
        last_message:
          $ref: '#/components/schemas/domain.Message'
        participants:
          items:
            $ref: '#/components/schemas/domain.Profile'
          type: array
          uniqueItems: false
      type: object
    domain.ChatsResponse:
      properties:
        chats:
          items:
            $ref: '#/components/schemas/domain.Chat'
          type: array
          uniqueItems: false
        has_more:
          example: true
          type: boolean
        limit:
          example: 10
          type: integer
        next_offset:
          example: 10
          type: integer
        offset:
          example: 0
          type: integer
      type: object
    domain.CreateChatRequest:
      properties:
        profile_id:
          example: 2
          type: integer
      required:
      - profile_id
      type: object
    domain.CreatePostRequest:
      properties:
        post_text:
          example: Привет, мир!
          maxLength: 256
          type: string
      type: object
    domain.CreateRelationshipRequest:
      properties:
        profile_id_slave:
          example: 2
          type: integer
        relationships_type:
          example: friendship
          type: string
      required:
      - profile_id_slave
      - relationships_type
      type: object
    domain.ErrorResponse:
      properties:
        code:
          example: invalid_credentials
          type: string
        message:
          example: Invalid credentials
          type: string
      type: object
    domain.FeedResponse:
      properties:
        cursor:
          example: 10
          type: integer
        has_more:
          example: true
          type: boolean
        limit:
          example: 10
          type: integer
        next_cursor:
          example: 20
          type: integer
        posts:
          items:
            $ref: '#/components/schemas/domain.Post'
          type: array
          uniqueItems: false
      type: object
    domain.Gender:
      enum:
      - male
      - female
      - other
      type: string
      x-enum-varnames:
      - GenderMale
      - GenderFemale
      - GenderOther
    domain.LoginRequest:
      properties:
        login:
          example: ivan_petrov
          maxLength: 254
          type: string
        password:
          example: strongpassword123
          maxLength: 64
          minLength: 8
          type: string
      required:
      - login
      - password
      type: object
    domain.MeResponse:
      properties:
        csrf_token:
          example: a1b2c3d4e5f6
          type: string
        profile:
          $ref: '#/components/schemas/domain.Profile'
      type: object
    domain.Message:
      properties:
        author_id:
          example: 1
          type: integer
        chat_id:
          example: 1
          type: integer
        created_at:
          example: "2026-01-01T12:00:00Z"
          type: string
        deleted_at:
          type: string
        id:
          example: 1
          type: integer
        message_text:
          example: Привет!
          type: string
        reply_from:
          example: 7
          type: integer
        repost_from:
          example: 5
          type: integer
        updated_at:
          example: "2026-01-01T12:05:00Z"
          type: string
      type: object
    domain.MessagesResponse:
      properties:
        chat_id:
          example: 1
          type: integer
        has_more:
          example: true
          type: boolean
        limit:
          example: 10
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/domain.Message'
          type: array
          uniqueItems: false
        next_offset:
          example: 10
          type: integer
        offset:
          example: 0
          type: integer
        parents:
          description: |-
            если у какого одного или нескольих сообщений есть родители
            (RepostFrom, ReplyFrom) то они будут в этом масиве
          items:
            $ref: '#/components/schemas/domain.Message'
          type: array
          uniqueItems: false
      type: object
    domain.Post:
      properties:
        author:
          $ref: '#/components/schemas/domain.Author'
        author_community_id:
          type: integer
        author_profile_id:
          example: 1
          type: integer
        comments_count:
          example: 0
          type: integer
        created_at:
          example: "2026-01-01T12:00:00Z"
          type: string
        deleted_at:
          type: string
        id:
          example: 1
          type: integer
        likes_count:
          example: 0
          type: integer
        media_count:
          example: 1
          type: integer
        media_urls:
          items:
            type: string
          type: array
          uniqueItems: false
        post_text:
          example: Привет, мир!
          type: string
        reposts_count:
          example: 0
          type: integer
        updated_at:
          type: string
      type: object
    domain.PostAuthorType:
      enum:
      - profile
      - community
      type: string
      x-enum-varnames:
      - AuthorProfile
      - AuthorCommunity
    domain.Profile:
      properties:
        avatar_urls:
          example:
          - /api/media/avatar1.png
          items:
            type: string
          type: array
          uniqueItems: false
        bio:
          example: hi!
          type: string
        birthday:
          example: "2000-05-14T00:00:00Z"
          type: string
        created_at:
          example: "2026-01-01T12:00:00Z"
          type: string
        deleted_at:
          type: string
        email:
          example: ivan@example.com
          type: string
        gender:
          $ref: '#/components/schemas/domain.Gender'
          example: male
        id:
          example: 1
          type: integer
        nickname:
          example: ivan_petrov
          type: string
        patronymic:
          example: Иванович
          type: string
        phone_number:
          example: "+79999999999"
          type: string
        profile_name:
          example: Иван
          type: string
        surname:
          example: Иванов
          type: string
        updated_at:
          example: "2026-01-02T12:00:00Z"
          type: string
      type: object
    domain.ProfileRelationship:
      properties:
        created_at:
          example: "2026-01-01T12:00:00Z"
          type: string
        deleted_at:
          type: string
        profile_id_master:
          example: 1
          type: integer
        profile_id_slave:
          example: 2
          type: integer
        relationships_status:
          $ref: '#/components/schemas/domain.RelationshipStatus'
          enum:
          - request
          - approved
          - canceled
          example: request
        relationships_type:
          example: friendship
          type: string
        updated_at:
          example: "2026-01-02T12:00:00Z"
          type: string
      type: object
    domain.RegisterRequest:
      properties:
        confirm_password:
          example: sjkdfhgs4536njbjjkh
          type: string
        nickname:
          example: ivan67
          maxLength: 32
          minLength: 4
          type: string
        password:
          example: sjkdfhgs4536njbjjkh
          maxLength: 64
          minLength: 8
          type: string
        privacy_policy_allowed:
          example: true
          type: boolean
      required:
      - confirm_password
      - nickname
      - password
      - privacy_policy_allowed
      type: object
    domain.RelationshipStatus:
      enum:
      - request
      - accepted
      - canceled
      type: string
      x-enum-varnames:
      - RelationshipRequest
      - RelationshipAccept
      - RelationshipCanceled
    domain.RelationshipSuggestion:
      properties:
        nickname:
          type: string
        profile_id:
          type: integer
      type: object
    domain.RelationshipSuggestionsResponse:
      properties:
        has_more:
          example: true
          type: boolean
        limit:
          example: 10
          type: integer
        next_offset:
          example: 10
          type: integer
        offset:
          example: 0
          type: integer
        profiles:
          items:
            $ref: '#/components/schemas/domain.RelationshipSuggestion'
          type: array
          uniqueItems: false
      type: object
    domain.RelationshipTypes:
      properties:
        relationships_types:
          items:
            $ref: '#/components/schemas/domain.RelationshipSuggestion'
          type: array
          uniqueItems: false
      required:
      - relationships_types
      type: object
    domain.RelationshipsResponse:
      properties:
        has_more:
          example: true
          type: boolean
        limit:
          example: 10
          type: integer
        next_offset:
          example: 10
          type: integer
        offset:
          example: 0
          type: integer
        relationships:
          items:
            $ref: '#/components/schemas/domain.ProfileRelationship'
          type: array
          uniqueItems: false
      type: object
    domain.SendMessageRequest:
      properties:
        chat_id:
          example: 1
          type: integer
        message_text:
          example: Привет!
          maxLength: 256
          type: string
        reply_from:
          example: 7
          type: integer
        repost_from:
          example: 5
          type: integer
      required:
      - chat_id
      - message_text
      type: object
    domain.UpdatePostRequest:
      properties:
        post_id:
          example: 1
          type: integer
        post_text:
          example: Обновлённый текст
          maxLength: 256
          type: string
      required:
      - post_id
      - post_text
      type: object
    domain.UpdateProfileRequest:
      properties:
        bio:
          example: hi!
          maxLength: 256
          type: string
        birthday:
          example: "2000-05-14"
          type: string
        confirm_password:
          example: sjkdfhgs4536njbjjkh
          type: string
        email:
          example: ivan@example.com
          maxLength: 254
          type: string
        gender:
          $ref: '#/components/schemas/domain.Gender'
          enum:
          - male
          - female
          example: male
        nickname:
          example: ivan67
          maxLength: 32
          minLength: 4
          type: string
        password:
          example: sjkdfhgs4536njbjjkh
          maxLength: 64
          minLength: 8
          type: string
        patronymic:
          example: Иванович
          maxLength: 32
          minLength: 2
          type: string
        phone_number:
          example: "+79999999999"
          type: string
        profile_name:
          example: Иван
          maxLength: 32
          minLength: 2
          type: string
        surname:
          example: Иванов
          maxLength: 32
          minLength: 2
          type: string
      type: object
    domain.UserPostsResponse:
      properties:
        cursor:
          example: 0
          type: integer
        has_more:
          example: true
          type: boolean
        limit:
          example: 10
          type: integer
        next_cursor:
          example: 10
          type: integer
        posts:
          items:
            $ref: '#/components/schemas/domain.Post'
          type: array
          uniqueItems: false
        profile_id:
          example: 1
          type: integer
      type: object
  securitySchemes:
    SessionCookie:
      in: cookie
      name: session_id
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: API
  title: Kvmm API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      description: Авторизует пользователя и создаёт сессию
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain.LoginRequest'
              description: Данные авторизации
              summary: request
        description: Данные авторизации
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.AuthResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
      summary: Авторизация пользователя
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Завершает текущую сессию пользователя
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Forbidden
      security:
      - SessionCookie: []
      summary: Выход из аккаунта
      tags:
      - auth
  /api/auth/me:
    get:
      description: Возвращает пользователя по авторизованной сессии
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.MeResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
      security:
      - SessionCookie: []
      summary: Текущий пользователь
      tags:
      - auth
  /api/auth/register:
    post:
      description: Регистрирует пользователя и создаёт авторизованную сессию
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain.RegisterRequest'
              description: Данные регистрации
              summary: request
        description: Данные регистрации
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.AuthResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Conflict
      summary: Регистрация пользователя
      tags:
      - auth
  /api/chats/create:
    post:
      description: Создаёт чат между текущим пользователем и указанным пользователем
      parameters:
      - description: CSRF-токен
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain.CreateChatRequest'
              description: Пользователь для создания чата
              summary: request
        description: Пользователь для создания чата
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.Chat'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Conflict
      security:
      - SessionCookie: []
      summary: Создать чат
      tags:
      - chats
  /api/chats/list:
    get:
      description: Возвращает чаты, в которых состоит текущий пользователь
      parameters:
      - description: Количество пропускаемых чатов
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      - description: Размер страницы (максимум 10)
        in: query
        name: limit
        schema:
          default: 10
          maximum: 10
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ChatsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
      security:
      - SessionCookie: []
      summary: Получить список чатов
      tags:
      - chats
  /api/chats/messages:
    get:
      description: Возвращает сообщения указанного чата в хронологическом порядке
      parameters:
      - description: Идентификатор чата
        in: query
        name: chat_id
        required: true
        schema:
          type: integer
      - description: Количество пропускаемых сообщений
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      - description: Размер страницы (максимум 10)
        in: query
        name: limit
        schema:
          default: 10
          maximum: 10
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.MessagesResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Not Found
      security:
      - SessionCookie: []
      summary: Получить сообщения чата
      tags:
      - chats
  /api/chats/send:
    post:
      description: Отправляет текстовое сообщение в чат, в котором состоит текущий
        пользователь
      parameters:
      - description: CSRF-токен
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain.SendMessageRequest'
              description: Текст сообщения
              summary: request
        description: Текст сообщения
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.Message'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Not Found
      security:
      - SessionCookie: []
      summary: Отправить сообщение
      tags:
      - chats
  /api/feed:
    get:
      description: Возвращает посты в обратном хронологическом порядке
      parameters:
      - description: Количество пропускаемых постов
        in: query
        name: cursor
        schema:
          default: 0
          type: integer
      - description: Размер страницы (максимум 10)
        in: query
        name: limit
        schema:
          default: 10
          maximum: 10
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.FeedResponse'
          description: OK
      summary: Лента публикаций
      tags:
      - feed
  /api/friends/accept:
    patch:
      description: Принимает запрос на связь указанному пользователю
      parameters:
      - description: CSRF-токен
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain.AcceptRelationshipRequest'
              description: Данные для принятия запроса в друзья
              summary: request
        description: Данные для принятия запроса в друзья
        required: true
      responses:
        "204":
          description: Запрос в друзья отправлен
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Conflict
      security:
      - SessionCookie: []
      summary: Принять запрос на связь
      tags:
      - relationships
  /api/posts/create:
    post:
      description: Создаёт публикацию текущего пользователя. Автор определяется по
        сессии
      parameters:
      - description: CSRF-токен
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/domain.CreatePostRequest'
              description: Данные публикации
              summary: request
        description: Данные публикации
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.Post'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/domain.ErrorResponse'
          description: Not Found
      security:
      - SessionCookie: []
      summary: Создать публикацию
      tags:
      - posts
  /api/posts/delete:
    delete:
      description: Помечает публикацию текущего пользователя удалённой
      parameters:
      - description: CSRF-токен
        in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      - description: ID публикации
        in: query
        name: request
        required: true
        schema:
          type: integer
      requestBody:
